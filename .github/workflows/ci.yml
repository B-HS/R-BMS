name: ci

# dev = 작업 브랜치, prod = 배포 브랜치. PR/푸시마다 전 플랫폼 빌드·테스트. web/ 만 바뀐 변경은 web.yml 이 검증한다.
# 단 web/data/tables/ 는 플레이어가 실행 파일에 넣고(tablesrc/seed.rs) 테스트가 읽으므로 여기서도 돈다.
on:
  push:
    branches: [dev, prod]
    paths:
      - "**"
      - "!web/**"
      - "web/data/tables/**"
  pull_request:
    branches: [dev, prod]
    paths:
      - "**"
      - "!web/**"
      - "web/data/tables/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Recent passing runs took 3 to 8 minutes per job (slowest: windows, 8.3 minutes). 30 minutes
    # leaves room for a cold cache, which compiles every dependency again, and still stops a hung
    # job long before the six hour default. Raise it if a run on an empty cache nears it.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      # Linux build needs the native dev libs that cpal (ALSA), gilrs (udev), winit (X11/Wayland)
      # and rfd (GTK3) link against. macOS/Windows use system frameworks.
      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libgtk-3-dev libudev-dev libxkbcommon-dev libwayland-dev \
            libx11-dev libxrandr-dev libxi-dev libxcursor-dev

      # Pinned to the same version as rust-toolchain.toml; bump both together.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
      - uses: Swatinem/rust-cache@v2

      # The release links the app icon into rbms-player.exe; compiling and linking it here too
      # shows a broken resource on every push instead of on the release run.
      - name: Compile the icon resource
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/windows-icon-resource.ps1

      - name: Build
        run: cargo build --workspace --locked
      # --no-fail-fast: every test binary runs even after one has failed, so one run shows every
      # failure on a platform instead of only the first.
      - name: Test
        run: cargo test --workspace --no-fail-fast --locked

  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libgtk-3-dev libudev-dev libxkbcommon-dev libwayland-dev \
            libx11-dev libxrandr-dev libxi-dev libxcursor-dev
      # Pinned to the same version as rust-toolchain.toml; bump both together.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # Gating: formatting and lint failures fail the build (see PROCESS.md).
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
