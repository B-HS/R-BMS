name: release

# 배포(prod) 브랜치 중심. 세 가지 경로:
#  1) prod 머지     — `prod`에 push되면 patch 자동 bump → 태그 → 빌드 → 릴리스 초안(draft).
#  2) 수동 bump     — Actions → "release" → Run workflow, bump(patch/minor/major) 선택.
#  3) 수동 태그     — `v1.2.3` 태그 push → 그 태그로 빌드 → 릴리스 초안(draft).
# 어느 경로든 태그와 초안까지만 자동이고, 게시(publish)는 사람이 GitHub 에서 한다.
on:
  push:
    branches: [prod]
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      bump:
        description: 'Semver bump'
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # --- Auto version: prod push 또는 수동 dispatch. 태그 push 시엔 skip(이미 버전 확정). ---
  version:
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Pinned to the same version as rust-toolchain.toml; bump both together. cargo follows that
      # file whatever is installed here, so a target added to another toolchain is never used.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
      - id: bump
        env:
          BUMP: ${{ github.event.inputs.bump || 'patch' }}
        run: |
          set -euo pipefail
          latest=$(git tag -l 'v*.*.*' --sort=-v:refname | head -n1)
          [ -z "$latest" ] && latest="v0.0.0"
          ver="${latest#v}"
          IFS=. read -r MA MI PA <<< "$ver"
          case "$BUMP" in
            major) MA=$((MA+1)); MI=0; PA=0 ;;
            minor) MI=$((MI+1)); PA=0 ;;
            patch|*) PA=$((PA+1)) ;;
          esac
          new="$MA.$MI.$PA"; tag="v$new"
          echo "next: $tag (from $latest)"
          # Update only the first `version = "x.y.z"` (the [workspace.package] one) in root Cargo.toml.
          # perl is portable (works the same on the runner and locally), unlike GNU-only `sed 0,/re/`.
          perl -i -pe 'if(!$d && /^version = "\d+\.\d+\.\d+"/){ s//version = "'"$new"'"/; $d=1 }' Cargo.toml
          grep -nE '^version = ' Cargo.toml | head -1
          # Cargo.lock is tracked and the builds use --locked, so the workspace members' versions in it move with Cargo.toml.
          cargo update --workspace
          git diff --stat -- Cargo.lock
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.toml Cargo.lock
          git commit -m "release: $tag"
          # The tag is pushed by name: --follow-tags sends annotated tags only, and the builds below
          # check this tag out, so it has to be on the remote whatever kind it is.
          git tag -a "$tag" -m "release: $tag"
          git push origin "HEAD:${GITHUB_REF_NAME}" "refs/tags/$tag"
          echo "version=$new" >> "$GITHUB_OUTPUT"
          echo "tag=$tag"     >> "$GITHUB_OUTPUT"

  build-macos:
    needs: [version]
    if: always() && needs.version.result != 'failure'
    runs-on: macos-latest
    # Signing and notarisation are used when their secrets are set and skipped when they are not,
    # so a repository with no Apple credentials still gets an ad-hoc signed build. The secret
    # names are the ones the maintainer's other macOS release already uses, so one set serves both.
    env:
      MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      # The credentials are checked before anything is built, so a wrong secret stops the job in
      # its first seconds instead of after the two release builds. With a Developer ID certificate:
      # a temporary keychain holds it for this job only, and the identity is read off the
      # certificate unless APPLE_SIGNING_IDENTITY names one. Only the shape of a bad value is
      # reported, never the value (signing-check.yml runs the same checks on their own).
      - name: Prepare the signing keychain
        if: env.MACOS_CERTIFICATE_P12 != ''
        run: |
          set -euo pipefail
          export LC_ALL=C
          KEYCHAIN="$RUNNER_TEMP/rbms-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          # tolerate wrapped or pasted base64 (newlines, CR, spaces)
          printf '%s' "$MACOS_CERTIFICATE_P12" | tr -d ' \t\r\n' > "$RUNNER_TEMP/certificate.b64"
          OUTSIDE="$(tr -d 'A-Za-z0-9+/=' < "$RUNNER_TEMP/certificate.b64" | wc -c | tr -d ' ')"
          if [ "$OUTSIDE" != "0" ] || ! base64 --decode < "$RUNNER_TEMP/certificate.b64" > "$RUNNER_TEMP/certificate.p12"; then
            rm -f "$RUNNER_TEMP/certificate.b64" "$RUNNER_TEMP/certificate.p12"
            echo "MACOS_CERTIFICATE_P12 is not the base64 text of a .p12 file ($OUTSIDE bytes outside the base64 alphabet)." >&2
            echo "Set it with: base64 -i certificate.p12 | gh secret set MACOS_CERTIFICATE_P12" >&2
            exit 1
          fi
          rm -f "$RUNNER_TEMP/certificate.b64"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          if ! security import "$RUNNER_TEMP/certificate.p12" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN" > /dev/null; then
            rm -f "$RUNNER_TEMP/certificate.p12"
            echo "The certificate did not open with MACOS_CERTIFICATE_PASSWORD." >&2
            exit 1
          fi
          rm -f "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychain -d user -s "$KEYCHAIN"
          IDENTITY="$APPLE_SIGNING_IDENTITY"
          if [ -z "$IDENTITY" ]; then
            IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | sed -n 's/.*"\(.*\)".*/\1/p' | head -1)"
          fi
          if [ -z "$IDENTITY" ]; then
            echo "failed to derive a signing identity from MACOS_CERTIFICATE_P12" >&2
            exit 1
          fi
          echo "SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
      - name: Check the notarisation account
        if: env.MACOS_CERTIFICATE_P12 != '' && env.APPLE_ID != '' && env.APPLE_APP_SPECIFIC_PASSWORD != '' && env.APPLE_TEAM_ID != ''
        run: |
          set -euo pipefail
          xcrun notarytool history --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID" > /dev/null
          echo "notarytool accepted the account"
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag || github.ref }}
      # Pinned to the same version as rust-toolchain.toml; bump both together. cargo follows that
      # file whatever is installed here, so a target added to another toolchain is never used.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      # rbms-player's default `video` feature is on, so this build includes the OpenH264 movie decoder
      # (compiled from source by the cc crate; no extra install step).
      - name: Build universal binary
        run: |
          set -euo pipefail
          cargo build --release --locked -p rbms-player --target aarch64-apple-darwin
          cargo build --release --locked -p rbms-player --target x86_64-apple-darwin
          mkdir -p dist
          lipo -create -output dist/rbms-player \
            target/aarch64-apple-darwin/release/rbms-player \
            target/x86_64-apple-darwin/release/rbms-player
          chmod +x dist/rbms-player
      # The binary goes out inside an app bundle on a disk image. A bare executable cannot carry its
      # notarisation ticket, so Gatekeeper had to look it up online and blocked a downloaded copy
      # (2026-10-14, v0.1.1); an app and a disk image can have the ticket stapled to them.
      - name: Make the app bundle
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          mkdir -p dist/app
          bash scripts/macos-app.sh dist/rbms-player "$VERSION" dist/app
      # The keychain prepared before the build holds the identity. The app is signed with the
      # hardened runtime and a secure timestamp, which notarisation needs.
      - name: Sign with Developer ID
        if: env.MACOS_CERTIFICATE_P12 != ''
        run: |
          set -euo pipefail
          codesign --force --options runtime --timestamp --sign "$SIGNING_IDENTITY" dist/app/R-BMS.app
          codesign --verify --deep --strict --verbose=2 dist/app/R-BMS.app
      # Without one: lipo invalidates the per-arch ad-hoc signatures, so the app is re-signed ad-hoc to
      # RUN on Apple Silicon (arm64 refuses unsigned code). Users then clear the Gatekeeper
      # quarantine on first run (see docs/ci-release.md).
      - name: Sign ad-hoc
        if: env.MACOS_CERTIFICATE_P12 == ''
        run: |
          set -euo pipefail
          codesign --force --sign - --timestamp=none dist/app/R-BMS.app
          codesign --verify --verbose dist/app/R-BMS.app || true
      # The app is notarised and its ticket stapled before it goes onto the disk image, so a copy
      # dragged to Applications passes Gatekeeper offline too.
      - name: Notarise the app
        if: env.MACOS_CERTIFICATE_P12 != '' && env.APPLE_ID != '' && env.APPLE_APP_SPECIFIC_PASSWORD != '' && env.APPLE_TEAM_ID != ''
        run: bash scripts/macos-notarize.sh dist/app/R-BMS.app
      - name: Make the disk image
        run: |
          set -euo pipefail
          # LICENSE and THIRD-PARTY-NOTICES.md must ship with the app (OpenH264 BSD-2, Inter OFL and the
          # other notices); a missing file fails the job instead of producing an image without them.
          STAGE="$RUNNER_TEMP/dmg"
          mkdir -p "$STAGE"
          ditto dist/app/R-BMS.app "$STAGE/R-BMS.app"
          ln -s /Applications "$STAGE/Applications"
          cp LICENSE README.md THIRD-PARTY-NOTICES.md "$STAGE/"
          hdiutil create -volname "R-BMS" -srcfolder "$STAGE" -ov -format UDZO dist/R-BMS-macos-universal.dmg
      - name: Sign and notarise the disk image
        if: env.MACOS_CERTIFICATE_P12 != '' && env.APPLE_ID != '' && env.APPLE_APP_SPECIFIC_PASSWORD != '' && env.APPLE_TEAM_ID != ''
        run: |
          set -euo pipefail
          codesign --force --timestamp --sign "$SIGNING_IDENTITY" dist/R-BMS-macos-universal.dmg
          bash scripts/macos-notarize.sh dist/R-BMS-macos-universal.dmg
      # Gatekeeper's own verdicts, as a downloaded copy would get them.
      - name: Check what Gatekeeper says
        if: env.MACOS_CERTIFICATE_P12 != '' && env.APPLE_ID != '' && env.APPLE_APP_SPECIFIC_PASSWORD != '' && env.APPLE_TEAM_ID != ''
        run: |
          set -euo pipefail
          spctl --assess --type execute --verbose=4 dist/app/R-BMS.app
          spctl --assess --type open --context context:primary-signature --verbose=4 dist/R-BMS-macos-universal.dmg
      - name: Checksums
        run: |
          set -euo pipefail
          cd dist && shasum -a 256 R-BMS-macos-universal.dmg > R-BMS-macos-universal.sha256
      - name: Remove the signing keychain
        if: always() && env.MACOS_CERTIFICATE_P12 != ''
        run: security delete-keychain "$RUNNER_TEMP/rbms-signing.keychain-db" || true
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            dist/R-BMS-macos-universal.dmg
            dist/R-BMS-macos-universal.sha256

  build-windows:
    needs: [version]
    if: always() && needs.version.result != 'failure'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag || github.ref }}
      # Pinned to the same version as rust-toolchain.toml; bump both together. cargo follows that
      # file whatever is installed here, so a target added to another toolchain is never used.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked -p rbms-player
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/rbms-player.exe dist/
          Copy-Item LICENSE, README.md, THIRD-PARTY-NOTICES.md dist/ -ErrorAction Stop
          Compress-Archive -Path dist/* -DestinationPath rbms-windows-x64.zip -Force
          # SHA-256 of the artifacts (would feed the backend client_build allowlist; see docs/backend).
          (Get-FileHash rbms-windows-x64.zip -Algorithm SHA256).Hash | Out-File -Encoding ascii rbms-windows-x64.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            rbms-windows-x64.zip
            rbms-windows-x64.sha256

  release:
    needs: [version, build-macos, build-windows]
    if: always() && needs.build-macos.result == 'success' && needs.build-windows.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      # Every run ends at a draft: the tag exists and the archives are attached, and a maintainer
      # reads the notes and publishes it by hand.
      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag || github.ref_name }}
          name: ${{ needs.version.outputs.tag || github.ref_name }}
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/macos/R-BMS-macos-universal.dmg
            artifacts/macos/R-BMS-macos-universal.sha256
            artifacts/windows/rbms-windows-x64.zip
            artifacts/windows/rbms-windows-x64.sha256
