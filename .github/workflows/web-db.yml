name: web-db

# Manual operations on the production database of web/ (https://bms.hyuns.uk). The database URL comes
# from the repository secret WEB_DATABASE_URL and is never printed. Run it from Actions → "web-db" →
# Run workflow, or `gh workflow run web-db.yml --ref dev -f action=<action>`. See docs/web/architecture.md.
on:
  workflow_dispatch:
    inputs:
      action:
        description: 'status: show what is applied / migrate: apply pending migrations / cleanup-count / cleanup-delete: the test accounts / chart-notes-count / chart-notes-repair: chart.notes that disagree with the accepted plays / chart-notes-restore: undo that repair / chart-notes-drop-backup: drop its backup so it can run again / admin-seed-count: count the rows the admin seed migration (0006) would change / assist-grade-backfill-count: count the stale chart_best.assist_grade / assist-grade-backfill: reset them from their score (as migration 0011 did, safe to repeat) / chart-purge-count / chart-purge-delete: every row of the chart removed at the request of the site owner (web/scripts/chart-purge.*.sql) / courses-seed-count / courses-seed: register the bundled GENOSIDE 2018 courses (count first, then apply) / tables-refresh-count: download the Stella and Satellite tables and only check them / tables-refresh-force: save them even when the change is large (run the count first) / dan-recompute-count / dan-recompute: give the dans that stored course runs already earn'
        type: choice
        options: [status, migrate, cleanup-count, cleanup-delete, chart-notes-count, chart-notes-repair, chart-notes-restore, chart-notes-drop-backup, admin-seed-count, assist-grade-backfill-count, assist-grade-backfill, chart-purge-count, chart-purge-delete, courses-seed-count, courses-seed, tables-refresh-count, tables-refresh-force, dan-recompute-count, dan-recompute]
        default: status

permissions:
  contents: read

concurrency:
  group: web-db
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    env:
      DATABASE_URL: ${{ secrets.WEB_DATABASE_URL }}
    steps:
      - name: Database secret is set
        working-directory: .
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "The repository secret WEB_DATABASE_URL is not set" >&2
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: web/package.json
      - name: Install
        run: bun install --frozen-lockfile
      # db:status exits 0 = up to date, 1 = action needed (pending migration or baseline), 2 = failed.
      - name: Status
        if: inputs.action == 'status'
        run: |
          code=0
          bun run db:status || code=$?
          if [ "$code" -eq 1 ]; then
            echo "::warning title=web-db status::Action needed (pending migration or baseline). Read the Result line above."
          elif [ "$code" -ne 0 ]; then
            exit "$code"
          fi
      - name: Status before
        if: inputs.action == 'migrate'
        run: bun run db:status || [ $? -eq 1 ]
      - name: Migrate
        if: inputs.action == 'migrate'
        run: bun run db:migrate
      - name: Status after
        if: inputs.action == 'migrate'
        run: bun run db:status
      - name: Count the test accounts
        if: inputs.action == 'cleanup-count' || inputs.action == 'cleanup-delete'
        run: bun scripts/run-sql.ts cleanup-test-accounts.count.sql
      - name: Delete the test accounts
        if: inputs.action == 'cleanup-delete'
        run: bun scripts/run-sql.ts cleanup-test-accounts.delete.sql
      - name: Count again
        if: inputs.action == 'cleanup-delete'
        run: bun scripts/run-sql.ts cleanup-test-accounts.count.sql
      - name: Count the chart notes
        if: startsWith(inputs.action, 'chart-notes-')
        run: bun scripts/run-sql.ts chart-notes.count.sql
      - name: Repair the chart notes
        if: inputs.action == 'chart-notes-repair'
        run: bun scripts/run-sql.ts chart-notes.repair.sql
      - name: Restore the chart notes the repair changed
        if: inputs.action == 'chart-notes-restore'
        run: bun scripts/run-sql.ts chart-notes.restore.sql
      - name: Drop the repair's backup
        if: inputs.action == 'chart-notes-drop-backup'
        run: bun scripts/run-sql.ts chart-notes.drop-backup.sql
      - name: Count the chart notes again
        if: startsWith(inputs.action, 'chart-notes-') && inputs.action != 'chart-notes-count'
        run: bun scripts/run-sql.ts chart-notes.count.sql
      - name: Count the admin seed target
        if: inputs.action == 'admin-seed-count'
        run: bun scripts/run-sql.ts admin-seed.count.sql
      - name: Count the stale assist grades
        if: startsWith(inputs.action, 'assist-grade-backfill')
        run: bun scripts/run-sql.ts assist-grade.count.sql
      - name: Backfill the assist grades
        if: inputs.action == 'assist-grade-backfill'
        run: bun scripts/run-sql.ts assist-grade.backfill.sql
      - name: Count the stale assist grades again
        if: inputs.action == 'assist-grade-backfill'
        run: bun scripts/run-sql.ts assist-grade.count.sql
      - name: Count the removed chart's rows
        if: startsWith(inputs.action, 'chart-purge-')
        run: bun scripts/run-sql.ts chart-purge.count.sql
      - name: Delete the removed chart's rows
        if: inputs.action == 'chart-purge-delete'
        run: bun scripts/run-sql.ts chart-purge.delete.sql
      - name: Count the removed chart's rows again
        if: inputs.action == 'chart-purge-delete'
        run: bun scripts/run-sql.ts chart-purge.count.sql
      - name: Count the course registration
        if: startsWith(inputs.action, 'courses-seed')
        run: bun scripts/seed-courses.ts count
      - name: Register the courses
        if: inputs.action == 'courses-seed'
        run: bun scripts/seed-courses.ts apply
      - name: Count the course registration again
        if: inputs.action == 'courses-seed'
        run: bun scripts/seed-courses.ts count
      - name: Check the tables
        if: startsWith(inputs.action, 'tables-refresh')
        run: bun scripts/refresh-tables.ts count
      - name: Save the tables even when the change is large
        if: inputs.action == 'tables-refresh-force'
        run: bun scripts/refresh-tables.ts apply-large
      - name: Check the tables again
        if: inputs.action == 'tables-refresh-force'
        run: bun scripts/refresh-tables.ts count
      - name: Count the dans to give
        if: startsWith(inputs.action, 'dan-recompute')
        run: bun scripts/dan-recompute.ts count
      - name: Give the dans
        if: inputs.action == 'dan-recompute'
        run: bun scripts/dan-recompute.ts apply
      - name: Count the dans to give again
        if: inputs.action == 'dan-recompute'
        run: bun scripts/dan-recompute.ts count
