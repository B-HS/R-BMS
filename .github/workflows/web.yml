name: web

# web/ (Next.js 점수 서버 겸 웹사이트) 전용 검증. Rust 워크플로(ci.yml)와 별개이며 web/ 또는 클라이언트 요청 계약 파일(contract/)이
# 바뀐 푸시와 PR 에서만 돈다.
on:
  push:
    branches: [dev, prod]
    paths:
      - "web/**"
      - "contract/**"
      - ".github/workflows/web.yml"
  pull_request:
    branches: [dev, prod]
    paths:
      - "web/**"
      - "contract/**"
      - ".github/workflows/web.yml"

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck, lint, test, format, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      # packageManager 필드(bun@1.4.0)와 같은 버전을 쓴다.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: web/package.json

      - name: Install
        run: bun install --frozen-lockfile

      # next typegen 을 포함한다(.next/types 가 없는 새 체크아웃에서도 LayoutProps 를 푼다).
      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

      - name: Format
        run: bun run format:check

      # 환경 변수 없이 빌드한다. DB 와 시크릿이 없어도 성공해야 한다(런타임에만 필요).
      - name: Build
        run: bun run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  # MySQL 을 쓰는 통합 테스트(web/tests/db). 일회용 컨테이너라 접속 값은 시크릿이 아니다.
  db:
    name: DB integration tests (MySQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4.11
        env:
          MYSQL_ROOT_PASSWORD: rbms-root
          MYSQL_DATABASE: rbms
          MYSQL_USER: rbms
          MYSQL_PASSWORD: rbms
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u rbms -prbms --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      DATABASE_URL: mysql://rbms:rbms@127.0.0.1:3306/rbms
      RBMS_DB_E2E: "1"
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: web/package.json

      - name: Install
        run: bun install --frozen-lockfile

      - name: Migrate
        run: bun run db:migrate

      # 0 = 최신. 마이그레이션이 남았거나 기준선이 필요하면 1, 실패면 2 로 끝난다.
      - name: Migration status
        run: bun run db:status

      - name: DB tests
        run: bun test tests/db
