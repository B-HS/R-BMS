name: web

# web/ (Next.js 점수 서버 겸 웹사이트) 전용 검증. Rust 워크플로(ci.yml)와 별개이며 web/ 이 바뀐 푸시와 PR 에서만 돈다.
on:
  push:
    branches: [dev, prod]
    paths:
      - "web/**"
      - ".github/workflows/web.yml"
  pull_request:
    branches: [dev, prod]
    paths:
      - "web/**"
      - ".github/workflows/web.yml"

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck, lint, test, format, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      # packageManager 필드(bun@1.4.0)와 같은 버전을 쓴다.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: web/package.json

      - name: Install
        run: bun install --frozen-lockfile

      # next typegen 을 포함한다(.next/types 가 없는 새 체크아웃에서도 LayoutProps 를 푼다).
      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

      - name: Format
        run: bun run format:check

      # 환경 변수 없이 빌드한다. DB 와 시크릿이 없어도 성공해야 한다(런타임에만 필요).
      - name: Build
        run: bun run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
