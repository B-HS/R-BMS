[workspace]
resolver = "3"
members = [
    "crates/rbms-model",
    "crates/rbms-parser",
    "crates/rbms-chart",
    "crates/rbms-judge",
    "crates/rbms-audio",
    "crates/rbms-render",
    "crates/rbms-skin",
    "crates/rbms-play",
    "crates/rbms-ir",
    "crates/rbms-table",
    "crates/rbms-store",
    "crates/rbms-config",
    "crates/rbms-library",
    "apps/rbms-cli",
    "apps/rbms-player",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "GPL-3.0-or-later"
rust-version = "1.95"

[workspace.dependencies]
rbms-model = { path = "crates/rbms-model" }
rbms-parser = { path = "crates/rbms-parser" }
rbms-chart = { path = "crates/rbms-chart" }
rbms-judge = { path = "crates/rbms-judge" }
rbms-audio = { path = "crates/rbms-audio" }
rbms-render = { path = "crates/rbms-render" }
rbms-skin = { path = "crates/rbms-skin" }
rbms-play = { path = "crates/rbms-play" }
rbms-ir = { path = "crates/rbms-ir" }
rbms-table = { path = "crates/rbms-table" }
rbms-store = { path = "crates/rbms-store" }
rbms-config = { path = "crates/rbms-config" }
rbms-library = { path = "crates/rbms-library" }
md-5 = "0.10"
sha2 = "0.10"
encoding_rs = "0.8"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
ron = "0.12.1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
thiserror = "2.0"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "allow"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
type_complexity = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
